    <script>
        // Mảng chứa dữ liệu 10 câu hỏi của bạn
        const questionData = [
            {
                q: '"Đại tạng kinh" hiểu theo nghĩa hẹp là chỉ cho phần nào?',
                options: [
                    "A. Kinh tạng và Luật tạng",
                    "B. Tam tạng: Kinh, Luật, Luận",
                    "C. Kinh tạng và Luận tạng",
                    "D. Kinh bộ (Kinh tạng) trong Tam tạng"
                ],
                answer: "D",
                exp: "Theo bài giảng, chữ 'tạng' vốn có nghĩa là cái giỏ tre chứa đựng kinh điển. Về nghĩa hẹp, Đại tạng kinh chỉ đề cập đến phần Kinh bộ."
            },
            {
                q: '"Đại tạng kinh" hiểu theo nghĩa rộng bao gồm những gì?',
                options: [
                    "A. Kinh điển Đại thừa",
                    "B. Tam tạng: Kinh, Luật, Luận",
                    "C. Kinh điển Nguyên thủy",
                    "D. Kinh tạng và Luật tạng"
                ],
                answer: "B",
                exp: "Khi thêm chữ 'Đại' (lớn), nghĩa rộng của Đại tạng kinh bao trùm toàn bộ Tam tạng gồm Kinh, Luật và Luận."
            },
            {
                q: 'Tam tạng thánh điển Phật giáo khi xưa còn được gọi bằng những danh xưng nào trước khi có từ "Đại tạng kinh"?',
                options: [
                    "A. Chúng kinh, quần kinh, nhất thiết kinh",
                    "B. Chánh tạng, Tục tạng",
                    "C. Toàn thư, bách khoa Phật giáo",
                    "D. Cổ dật, Nghi tợ"
                ],
                answer: "A",
                exp: "Trong giai đoạn đầu, kinh điển được gọi là toàn thư, chúng kinh, quần kinh hoặc nhất thiết kinh."
            },
            {
                q: 'Danh xưng "Đại tạng kinh" bắt đầu xuất hiện từ triều đại nào của Trung Quốc trở về sau?',
                options: [
                    "A. Đời Hán",
                    "B. Đời Tấn",
                    "C. Đời Tùy",
                    "D. Đời Đường"
                ],
                answer: "C",
                exp: "Thầy giáo nhấn mạnh từ đời Tùy trở về sau thì tên gọi 'Đại tạng kinh' mới chính thức xuất hiện. Trước đó (như đời Hán) thì chưa có danh xưng này."
            },
            {
                q: 'Hán văn Đại tạng kinh bao gồm những nội dung chủ yếu nào?',
                options: [
                    "A. Chỉ gồm kinh điển phiên dịch từ tiếng Phạn",
                    "B. Phần kinh điển phiên dịch và phần trước tác Phật học do người Trung Quốc biên soạn",
                    "C. Chỉ gồm các tác phẩm do các cao tăng Trung Quốc viết",
                    "D. Kinh điển hệ A Hàm và Nikaya"
                ],
                answer: "B",
                exp: "Đây là điểm Ni sư rất lưu ý: Đại tạng kinh Hán văn không chỉ có kinh sách được dịch từ Ấn Độ sang, mà bắt buộc phải bao gồm cả phần 'trước tác' (sớ giải, ngữ lục, sử truyện...) do các vị cao tăng, học giả Trung Quốc (và cả Cao Ly, Nhật Bản) biên soạn."
            },
            {
                q: 'Lần kiết tập kinh điển thứ nhất được tổ chức với số lượng bao nhiêu vị và vào thời gian nào?',
                options: [
                    "A. 500 vị - Mùa hạ năm Đức Phật nhập Niết bàn",
                    "B. 700 vị - Sau 100 năm Đức Phật nhập Niết bàn",
                    "C. 1000 vị - Mùa hạ năm Đức Phật nhập Niết bàn",
                    "D. 500 vị - Sau 400 năm"
                ],
                answer: "A",
                exp: "Mẹo học số lượng tham dự 4 kỳ kiết tập do Ni sư hướng dẫn: 500 -> 700 -> 1000 -> 500. Lần thứ nhất là 500 vị, diễn ra ngay mùa hạ năm Phật nhập diệt."
            },
            {
                q: 'Nguyên nhân chính dẫn đến kỳ kiết tập kinh điển lần thứ nhất là gì?',
                options: [
                    "A. Do ngoại đạo trà trộn vào Tăng đoàn",
                    "B. Chư tăng có kiến giải bất đồng về kinh điển",
                    "C. Nhóm tỳ-kheo Bạt Kỳ đưa ra 10 điều phi pháp",
                    "D. Tỳ-kheo Bạc Nan Đà vui mừng khi nghe tin Đức Phật nhập Niết bàn"
                ],
                answer: "D",
                exp: "Tỳ-kheo Bạc Nan Đà cho rằng Phật nhập diệt là một sự 'giải thoát' khỏi các giới luật ràng buộc. Lời nói này khiến ngài Đại Ca Diếp lo ngại chánh pháp bị mai một nên đã lập tức triệu tập hội nghị."
            },
            {
                q: 'Trong kỳ kiết tập thứ nhất, ngài U-ba-ly (Upali) và ngài A Nan đã trùng tuyên những gì?',
                options: [
                    "A. Ngài U-ba-ly trùng tuyên Kinh tạng, ngài A Nan trùng tuyên Luật tạng",
                    "B. Ngài U-ba-ly trùng tuyên Luật tạng trước (Bát thập tụng luật), ngài A Nan trùng tuyên Kinh tạng (Hệ A Hàm)",
                    "C. Cả hai ngài cùng trùng tuyên Luận tạng",
                    "D. Ngài A Nan trùng tuyên Luật tạng trước"
                ],
                answer: "B",
                exp: "Thứ tự kiết tập là Luật trước, Kinh sau. Ngài U-ba-ly tụng Luật 80 lần (Bát thập tụng luật). Ngài A Nan tụng Kinh tạng. Vì đây là môn Văn học Hán Tạng, nên hệ kinh ngài A Nan tụng được xác định là hệ A Hàm (chứ không gọi là Nikaya như bên Nam truyền)."
            },
            {
                q: 'Kỳ kiết tập lần thứ hai được tổ chức tại đâu và vì nguyên nhân gì?',
                options: [
                    "A. Vương Xá - Tỳ kheo Bạc Nan Đà",
                    "B. Ca Thấp Di La - Kiến giải bất đồng",
                    "C. Tỳ Xá Ly - 10 điều phi pháp của nhóm Tỳ-kheo Bạt Kỳ",
                    "D. Hoa Thị - Ngoại đạo trà trộn"
                ],
                answer: "C",
                exp: "Lần 2 diễn ra tại thành Tỳ Xá Ly (sau 100 năm), do ngài Trưởng lão Da Xá chủ trì để giải quyết 10 điều luật bị coi là phi pháp do nhóm Tỳ-kheo Bạt Kỳ đưa ra."
            },
            {
                q: 'Kỳ kiết tập kinh điển lần thứ ba do ai bảo trợ và có điểm gì đặc biệt về nội dung?',
                options: [
                    "A. Vua A Xà Thế - Có đầy đủ Kinh và Luật",
                    "B. Vua Ca Nị Sắc Ca - Xuất hiện sớ giải",
                    "C. Vua A Dục (Asoka) - Lần đầu tiên có đầy đủ Kinh, Luật và Luận",
                    "D. Vua Hán Minh Đế - Bắt đầu dịch ra tiếng Hán"
                ],
                answer: "C",
                exp: "Dưới sự bảo trợ của Vua A Dục, kỳ kiết tập lần 3 (1000 vị, tại Hoa Thị) đánh dấu sự ra đời và hoàn thiện của Luận tạng, nên có đầy đủ Kinh, Luật, Luận."
            },
            // Nhớ đảm bảo có dấu phẩy ở cuối khối { ... } của câu 10 trước khi dán đoạn này vào nhé!
            {
                q: 'Chủ tọa của kỳ kiết tập kinh điển lần thứ tư là ai?',
                options: [
                    "A. Ngài Đại Ca Diếp",
                    "B. Đệ nhất chủ tọa là Thế Hữu, đệ nhị là Hiếp Tôn Giả",
                    "C. Trưởng lão Da Xá",
                    "D. Ngài Mục Kiền Liên Tử Đế Tu"
                ],
                answer: "B",
                exp: "Lần thứ 4 tổ chức tại Ca Thấp Di La do vua Ca Nị Sắc Ca bảo trợ. Ngài Hiếp Tôn Giả là người khởi xướng nhưng đã nhường vị trí Đệ nhất chủ tọa cho ngài Thế Hữu vì nể phục tài trí."
            },
            {
                q: 'Theo thuyết được công nhận, quyển kinh Phật đầu tiên truyền vào Trung Quốc bằng hình thức "khẩu truyền" (truyền miệng) là quyển nào và vào thời nào?',
                options: [
                    "A. Kinh Tứ Thập Nhị Chương - Đời Đông Hán",
                    "B. Kinh Phù Đồ - Cuối thời Tây Hán (Tiền Hán)",
                    "C. Kinh Đạo Hành Bát Nhã - Thời Tam Quốc",
                    "D. Kinh Bát Đại Nhân Giác - Đời Tùy"
                ],
                answer: "B",
                exp: 'Truyền thuyết "khẩu truyền Phật giáo của Y Tồn" ghi nhận sứ giả Y Tồn (nước Đại Nguyệt Chi) đã khẩu truyền kinh Phù Đồ vào năm -2 (trước Tây lịch), tức là cuối thời Tây Hán (hay Tiền Hán).'
            },
            {
                q: 'Quyển kinh đầu tiên được chính thức "phiên dịch" ra tiếng Hán là quyển nào, do ai dịch?',
                options: [
                    "A. Kinh Phù Đồ do Y Tồn dịch",
                    "B. Kinh An Ban Thủ Ý do An Thế Cao dịch",
                    "C. Tứ Thập Nhị Chương do Ca Diếp Ma Đằng và Trúc Pháp Lan dịch",
                    "D. Đạo Hành Bát Nhã do Chi Lâu Ca Sấm dịch"
                ],
                answer: "C",
                exp: "Dưới thời vua Hán Minh Đế (năm 67 s.CN), ngài Ca Diếp Ma Đằng và Trúc Pháp Lan đã dùng ngựa trắng chở kinh về và dịch quyển Tứ Thập Nhị Chương."
            },
            {
                q: 'Ngôi chùa Phật giáo đầu tiên được xây dựng tại Trung Quốc mang tên là gì?',
                options: [
                    "A. Hồng Lô Tự",
                    "B. Thiếu Lâm Tự",
                    "C. Bạch Mã Tự (Chùa Bạch Mã)",
                    "D. Khai Nguyên Tự"
                ],
                answer: "C",
                exp: 'Thầy giáo rất lưu ý điểm này: "Hồng Lô Tự" chỉ là cơ quan hành chính tiếp khách quốc tế nơi 2 ngài ở tạm ban đầu. Sau đó nhà vua mới cho xây dựng "Bạch Mã Tự" để kỷ niệm việc dùng ngựa trắng chở kinh. Đây mới là ngôi chùa đầu tiên.'
            },
            {
                q: 'Các hình thức lưu truyền của Đại tạng kinh phát triển theo thứ tự nào?',
                options: [
                    "A. Khắc in -> Tụng đọc -> Điện tử -> Chép tay",
                    "B. Chép tay -> Khắc đá -> Tụng đọc -> Điện tử",
                    "C. Tụng đọc -> Chép (lá bối/giấy) -> Khắc in (mộc bản/đá) -> Điện tử",
                    "D. Tụng đọc -> Điện tử -> Chép tay -> Khắc in"
                ],
                answer: "C",
                exp: "Quy trình phát triển: Ban đầu là tụng đọc (khẩu truyền) -> Sau đó chép tay (trước tiên trên lá bối, sau đó trên giấy/máu) -> Khắc in (khắc lên vách đá rồi in mộc bản) -> Thời nay là số hóa điện tử (CD, Internet)"
            },
            // Nhớ đảm bảo có dấu phẩy ở cuối khối { ... } của câu 15 trước khi dán đoạn này vào nhé!
            {
                q: 'Lịch sử phiên dịch kinh điển Phật giáo ra tiếng Hán được chia thành mấy thời kỳ theo thứ tự thời gian?',
                options: [
                    "A. 4 thời kỳ (Lưỡng Hán, Tam Quốc, Tùy Đường, Tống)",
                    "B. 5 thời kỳ (Lưỡng Hán Tam Quốc, Lưỡng Tấn Nhị Tần, Nam Bắc Triều, Tùy Đường, Tống)",
                    "C. 3 thời kỳ (Lưỡng Hán, Nam Bắc Triều, Tùy Đường)",
                    "D. 6 thời kỳ"
                ],
                answer: "B",
                exp: "Ni sư có chỉ một mẹo để nhớ thứ tự 5 thời kỳ rất hay: Thời kỳ 3 có 3 chữ (Nam Bắc Triều), thời kỳ 4 giảm còn 2 chữ (Tùy Đường), thời kỳ 5 còn 1 chữ (Tống). Bạn cứ dựa vào mẹo đếm chữ này để đánh trắc nghiệm khi bị hỏi về thứ tự các thời kỳ nhé."

        // Thuật toán trộn mảng (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Hàm render câu hỏi ra HTML
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; // Xóa trắng nội dung cũ

            // Trộn câu hỏi
            const shuffledQuestions = shuffleArray([...questionData]);

            shuffledQuestions.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-card';

                // Render danh sách options
                let optionsHTML = '';
                item.options.forEach(opt => {
                    optionsHTML += `<li class="option-item">${opt}</li>`;
                });

                questionDiv.innerHTML = `
                    <div class="question-title">Câu ${index + 1}: ${item.q}</div>
                    <ul class="options-list">
                        ${optionsHTML}
                    </ul>
                    <button class="btn-reveal" onclick="toggleAnswer('ans-${index}')">👁️ Xem Đáp Án</button>
                    
                    <div id="ans-${index}" class="answer-section">
                        <div class="correct-ans">Đáp án đúng: ${item.answer}</div>
                        <div class="explanation">
                            <strong>💡 Giải thích:</strong> ${item.exp}
                        </div>
                    </div>
                `;
                container.appendChild(questionDiv);
            });
        }

            container.appendChild(questionDiv);
        }

        // Hàm Ẩn/Hiện đáp án
        function toggleAnswer(id) {
            const ansDiv = document.getElementById(id);
            if (ansDiv.style.display === "none" || ansDiv.style.display === "") {
                ansDiv.style.display = "block";
            } else {
                ansDiv.style.display = "none";
            }
        }

        // Tự động load câu hỏi khi vừa mở trang
        window.onload = renderQuiz;
    </script>
</body>
</html>
